<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f0ede4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10110e" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pelada">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Pelada de Segunda</title>
<style>
/* Súmula de papel + placar de estádio. Uma fonte condensada para números e títulos, cor só onde significa algo. */
:root{
  --d:"Barlow Condensed","Arial Narrow",sans-serif-condensed,system-ui,sans-serif;
  --paper:#f0ede4;--raise:#faf8f2;--ink:#16160f;--ink2:#5f5c52;--rule:#d8d3c5;--rule2:#b9b3a3;
  --on:#16160f;--on-ink:#f6f3ea;--signal:#cf2f1d;--soft:#e4dfd1;
  --board:#141511;--board2:#22231e;--board-ink:#f3efe3;--board-dim:#8f8b7e;--amber:#f2b632;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#10110e;--raise:#1a1b17;--ink:#ebe7db;--ink2:#9b978a;--rule:#2a2b26;--rule2:#3d3e37;
    --on:#ebe7db;--on-ink:#12130f;--signal:#ff5b44;--soft:#24251f;
    --board:#060705;--board2:#191a16;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);
  font:16px/1.45 Barlow,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:0 0 calc(72px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
#app{max-width:560px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 18px 24px}
.num,.clock,.val,.pos,.res b,.log .t,.pbtn .g{font-variant-numeric:tabular-nums}

/* cabeçalho de cada tela */
.mast{padding:14px 0 18px}
.kick{font:600 13px/1.2 var(--d);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
h1{font:700 46px/.92 var(--d);text-transform:uppercase;margin:6px 0 0;letter-spacing:-.01em}
.mast.big h1{font-size:68px;line-height:.86}
.mast .lede{margin:14px 0 0;max-width:30em;color:var(--ink2)}

/* blocos da súmula: régua grossa em cima, rótulo em caixa alta */
.card{border-top:2px solid var(--ink);padding:10px 0 2px;margin:0 0 30px}
h2{display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  font:600 14px/1.2 var(--d);text-transform:uppercase;letter-spacing:.12em;color:var(--ink);margin:0 0 12px}
h2 small{font:inherit;color:var(--ink2);letter-spacing:.06em}
.muted{color:var(--ink2);font-size:14px}

/* botões */
button,select{font:inherit;color:inherit;cursor:pointer}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;margin-top:10px;
  border-radius:6px;border:1px solid var(--rule2);background:transparent;padding:10px 16px;
  font:600 17px/1.1 var(--d);text-transform:uppercase;letter-spacing:.06em}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--on);color:var(--on-ink);border-color:var(--on)}
.btn.danger{color:var(--signal);border-color:transparent;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.btn.small{display:inline-flex;width:auto;min-height:38px;margin:0;padding:6px 12px;font-size:14px}
.btn.small.danger{text-decoration:none;border-color:var(--rule2)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}

/* campos */
input[type=text],select{font:inherit;color:var(--ink);background:var(--raise);border:1px solid var(--rule2);border-radius:6px;
  min-height:48px;padding:8px 12px;width:100%;min-width:0}
select.mini{width:auto;min-height:38px;padding:4px 8px;font-size:14px}
.fld{display:block;font:600 12px/1.2 var(--d);letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.fld select{margin-top:6px;font:500 16px/1.2 Barlow,system-ui,sans-serif;letter-spacing:0;text-transform:none}
.check{display:flex;align-items:center;gap:10px;min-height:44px;margin-top:8px}
.check input{width:20px;height:20px;accent-color:var(--ink)}

/* nomes dos jogadores */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:40px;border-radius:4px;border:1px solid var(--rule2);background:transparent;padding:6px 12px;font-weight:500}
.chip.on{background:var(--on);color:var(--on-ink);border-color:var(--on)}
.chip.team{border-left:4px solid var(--tc);padding-left:10px}
.chip .r{font:600 13px var(--d);color:var(--ink2);margin-left:4px}
.chip.on .r{color:inherit;opacity:.7}
.seg{display:flex;gap:18px;border-bottom:1px solid var(--rule);margin-bottom:14px}
.seg button{min-height:42px;border:0;background:none;padding:0;margin-bottom:-1px;border-bottom:2px solid transparent;
  font:600 16px var(--d);text-transform:uppercase;letter-spacing:.08em;color:var(--ink2)}
.seg button.on{color:var(--ink);border-bottom-color:var(--ink)}
.teamhead{display:flex;align-items:baseline;gap:8px;margin:18px 0 8px;
  font:700 18px/1 var(--d);text-transform:uppercase;letter-spacing:.04em}
.teamhead .dot{align-self:center}
.teamhead .muted{font:500 14px var(--d);letter-spacing:.06em}
.dot{width:10px;height:10px;border-radius:2px;background:var(--tc);flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
.vs{font:600 13px var(--d);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);margin:0 0 10px}

/* placar de estádio */
.board{background:var(--board);color:var(--board-ink);border-radius:8px;padding:16px 16px 14px;margin:6px 0 12px;
  border:1px solid var(--board2)}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:6px}
.score>div{min-width:0}
.score>div:last-child{text-align:right}
.score .tn{display:flex;align-items:center;gap:7px;font:600 15px/1.1 var(--d);text-transform:uppercase;letter-spacing:.1em;
  overflow-wrap:anywhere}
.score>div:last-child .tn{flex-direction:row-reverse}
.score .tn i{width:12px;height:12px;border-radius:2px;background:var(--tc);flex:none}
.score .num{font:700 112px/.82 var(--d);margin-top:12px;letter-spacing:-.02em}
.score .x{font:500 28px/1 var(--d);color:var(--board-dim);padding-bottom:16px}
.clock{display:inline-block;font:600 30px/1 var(--d);color:var(--amber);letter-spacing:.04em;
  background:var(--board2);border-radius:4px;padding:6px 10px 4px}
.btop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;
  font:600 12px var(--d);letter-spacing:.14em;text-transform:uppercase;color:var(--board-dim)}
.btop .lim{text-align:right}
.over{background:var(--amber);color:#16160f;border-radius:4px;padding:9px 12px;margin-top:14px;text-align:center;
  font:700 17px var(--d);text-transform:uppercase;letter-spacing:.08em}
.board .btn{color:var(--board-ink);border-color:#3a3b34;margin-top:14px;min-height:46px}

/* botões dos jogadores durante o jogo */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.colh{display:flex;align-items:center;gap:7px;margin:4px 0 8px;font:600 13px var(--d);letter-spacing:.12em;text-transform:uppercase}
.pbtn{display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%;min-height:56px;margin-bottom:6px;
  border-radius:6px;border:1px solid var(--rule2);box-shadow:inset 4px 0 0 var(--tc);background:var(--raise);
  padding:8px 10px 8px 14px;font-weight:600;text-align:left;overflow-wrap:anywhere;line-height:1.15}
.pbtn small{display:block;font:600 11px var(--d);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);margin-top:3px}
.pbtn .g{font:700 26px/1 var(--d);flex:none}
.pbtn.gk{background:var(--soft)}
.warn{font:600 12px var(--d);letter-spacing:.1em;text-transform:uppercase;color:var(--signal);margin-bottom:8px}
.log{list-style:none;margin:0;padding:0}
.log li{display:flex;gap:12px;padding:9px 0;border-top:1px solid var(--rule);font-size:15px}
.log li:first-child{border-top:0}
.log .t{font:600 16px/1.35 var(--d);color:var(--ink2);flex:none;width:44px}
.log .muted{display:block;font-size:13px}

/* listas e classificações */
.rank{list-style:none;margin:0;padding:0}
.rank li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--rule)}
.rank li:first-child{border-top:0;padding-top:4px}
.rank .pos{width:24px;font:600 18px var(--d);color:var(--ink2);flex:none}
.rank .nm{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:600}
.rank .nm small{display:block;font-weight:400;color:var(--ink2);font-size:13px}
.rank .val{font:700 24px/1 var(--d);text-align:right;flex:none}
.rank .val small{display:block;font:500 12px/1.3 Barlow,system-ui,sans-serif;color:var(--ink2);margin-top:2px}
.rank li:first-child .pos{color:var(--ink)}
.rank li:first-child .nm{font-size:19px}
.rank li:first-child .val{font-size:36px}
.tag{display:inline-block;font:600 11px/1.5 var(--d);letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--rule2);border-radius:3px;padding:0 5px;color:var(--ink2);vertical-align:1px}
.tag.hot{background:var(--signal);border-color:var(--signal);color:#fff}
.note{margin:10px 0 0;font-size:13px;color:var(--ink2)}
.stale{border:1px solid var(--signal);border-radius:6px;padding:12px 14px;margin:0 0 26px}
.stale b{display:block;font:600 15px/1.3 Barlow,system-ui,sans-serif}
.stale .btn{margin-top:10px}
.stale .muted{display:block;margin-top:2px}
.empty{margin:0;color:var(--ink2)}
.link{background:none;border:0;padding:10px 0 0;min-height:40px;color:var(--ink);font:600 15px/1.2 Barlow,system-ui,sans-serif;
  text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.paste{margin-top:14px;padding-top:12px;border-top:1px dashed var(--rule2)}
.paste textarea{display:block;width:100%;min-height:150px;resize:vertical;font:15px/1.45 Barlow,system-ui,sans-serif;color:var(--ink);
  background:var(--raise);border:1px solid var(--rule2);border-radius:6px;padding:10px 12px}
.paste .chips{margin-top:10px}
.chip.new{border-style:dashed}
.res{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--rule)}
.res:first-child,h2+.res,h2+.item,h2+p+.item{border-top:0}
.res span{display:flex;align-items:center;gap:7px;font-weight:600;min-width:0}
.res span:last-child{justify-content:flex-end}
.res b{font:700 20px var(--d);letter-spacing:.04em;min-width:58px;text-align:center}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;flex-wrap:wrap;
  background:none;border:0;border-top:1px solid var(--rule);padding:12px 0;min-height:56px}
.item:first-child{border-top:0}
.item .when{display:block;font:700 22px/1 var(--d);text-transform:uppercase;letter-spacing:.02em;margin-bottom:4px}
.item .go{font:500 26px/1 var(--d);color:var(--ink2)}
.acts{display:flex;gap:6px;align-items:center}

/* navegação */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--rule2);
  display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:4}
nav button{position:relative;flex:1;max-width:180px;min-height:62px;border:0;background:none;color:var(--ink2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font:600 12px var(--d);letter-spacing:.14em;text-transform:uppercase}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--ink)}
nav button.on::before{content:"";position:absolute;top:-1px;left:30%;right:30%;height:3px;background:var(--ink)}

/* folha de ações */
.back{position:fixed;inset:0;background:rgba(10,10,8,.5);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sheet{background:var(--paper);width:100%;max-width:560px;border-radius:12px 12px 0 0;max-height:90vh;overflow:auto;
  padding:10px 18px calc(18px + env(safe-area-inset-bottom))}
.sheet::before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:var(--rule2);margin:0 auto 14px}
.sheet h3{margin:0;font:700 34px/1 var(--d);text-transform:uppercase}
.sheet .muted{display:flex;align-items:center;gap:7px;margin:6px 0 6px;font:600 13px var(--d);letter-spacing:.12em;text-transform:uppercase}
#toast{position:fixed;left:16px;right:16px;top:calc(12px + env(safe-area-inset-top));margin:0 auto;max-width:528px;
  background:var(--on);color:var(--on-ink);border-radius:6px;padding:12px 14px;display:none;
  align-items:center;justify-content:space-between;gap:10px;z-index:6;font-weight:600}
#toast button{background:none;border:0;color:inherit;text-decoration:underline;font-weight:700;min-height:32px}
body.ro .ed{display:none!important}
body.ro .chip,body.ro .pbtn{pointer-events:none}
.live{display:inline-flex;align-items:center;gap:8px;font:600 13px var(--d);letter-spacing:.16em;text-transform:uppercase;
  color:var(--signal);margin:8px 0 2px}
.live i{width:8px;height:8px;border-radius:50%;background:currentColor;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.live i{animation:none}.btn:active{transform:none}}
@media (min-width:600px){#app{padding-top:28px}.mast.big h1{font-size:84px}}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"></nav>
<div id="toast"></div>
<script>
'use strict';
const KEY='pelada.v1', MIN_GK=5*60000;
const COLORS=[['Azul','#2458c6'],['Vermelho','#d23a2c'],['Verde','#1d8a4c'],['Amarelo','#e2a400']];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const fmtDate=d=>{const p=String(d).split('-');return p[2]+'/'+p[1]+'/'+p[0]};
const fmtClock=ms=>{const s=Math.floor(ms/1000);return pad(Math.floor(s/60))+':'+pad(s%60)};
const fmtMin=ms=>ms<60000?Math.round(ms/1000)+' s':Math.round(ms/60000)+' min';
const plural=(n,a,b)=>n+' '+(n===1?a:b);
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const longDate=d=>{const p=String(d).split('-');return Number(p[2])+' de '+MESES[Number(p[1])-1]};
const colorOf=name=>(COLORS.find(c=>c[0]===name)||[0,'#888'])[1];

/* ---------- estado ---------- */
const LEGACY={}; // notas que versões antigas guardavam junto dos jogadores: migram para as notas do admin
function normalize(d){
  d=d||{};
  const rules=Object.assign({min:0,goals:0,assist:true},d.prefs&&d.prefs.rules);
  const players=(d.players||[]).map(p=>{
    if(!p||p.rating==null)return p;
    LEGACY[p.id]=Math.min(5,Math.max(1,Number(p.rating)||3));
    const{rating,...rest}=p;return rest;
  });
  return{players,sessions:d.sessions||[],current:d.current||null,prefs:{rules}};
}
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
const parse=t=>{try{return normalize(JSON.parse(t))}catch(e){return normalize()}};

/* ---------- placar ao vivo (Firebase) ----------
   Dois papéis com senha: o marcador grava o placar; o admin também grava e é o único que vê e muda
   as notas dos jogadores, guardadas no banco cifradas com a senha dele. Quem não tem senha só acompanha.
   Fora do Firebase Hosting não há configuração, e o app funciona só neste aparelho. */
const CONFIG_URL='/__/firebase/init.json'; // o Firebase Hosting entrega a configuração do projeto neste endereço
const FB='https://www.gstatic.com/firebasejs/12.0.0/';
const DB_ID='(default)';
const DEVICE=ls.get('pelada.device')||(()=>{const d=uid()+uid();ls.set('pelada.device',d);return d})();
const cloud={on:false,exists:ls.get('pelada.cloud')==='1',key:ls.get('pelada.key'),
  role:ls.get('pelada.key')?(ls.get('pelada.role')||'marcador'):null,adminExists:ls.get('pelada.admin')==='1',
  last:null,timer:null,sent:null,fs:null,db:null,retried:false,
  nk:null,notasLoaded:false,notasTimer:null,unNotas:null};
const isViewer=()=>cloud.exists&&!cloud.key;
const isAdmin=()=>cloud.role==='admin'&&!!cloud.key;
const localMode=()=>!cloud.exists&&!cloud.key;
const canRate=()=>localMode()||(isAdmin()&&cloud.notasLoaded);

function load(){return parse(ls.get(isViewer()?'pelada.cache':KEY))}
function save(){
  if(isViewer())return;
  const j=JSON.stringify(S);
  if(j===cloud.sent)return;
  cloud.sent=j;ls.set(KEY,j);
  if(cloud.on&&cloud.key){clearTimeout(cloud.timer);cloud.timer=setTimeout(()=>{cloud.timer=null;send().catch(failWith(send))},700)}
}
const keyDoc=b=>b.set(cloud.fs.doc(cloud.db,'chaves',isAdmin()?'admin':'pelada'),{senha:cloud.key,at:cloud.fs.serverTimestamp()});
function send(){
  const{fs,db}=cloud,b=fs.writeBatch(db);
  keyDoc(b);
  b.set(fs.doc(db,'grupos','pelada'),{data:JSON.stringify(S),at:fs.serverTimestamp(),by:DEVICE});
  return b.commit();
}
function failWith(again){ // uma recusa isolada não derruba ninguém; duas seguidas, a senha mudou
  return e=>{
    if(!e||e.code!=='permission-denied'||!cloud.key)return;
    if(!cloud.retried){cloud.retried=true;setTimeout(()=>{if(cloud.key)again().then(()=>{cloud.retried=false},failWith(again))},4000);return}
    cloud.retried=false;
    dropRole();render();toast('Sua senha não vale mais neste celular. Entre de novo em Histórico.');
  };
}
function dropRole(){
  clearTimeout(cloud.timer);cloud.timer=null;stopNotas();
  cloud.key=null;cloud.role=null;ls.set('pelada.key',null);ls.set('pelada.role',null);
  if(cloud.last){S=parse(cloud.last);ls.set('pelada.cache',cloud.last)}
  ui.sheet=null;
}
function onRemote(snap){
  cloud.exists=snap.exists();ls.set('pelada.cloud',cloud.exists?'1':null);
  if(cloud.exists&&!snap.metadata.hasPendingWrites){
    const d=snap.data();cloud.last=d.data;
    if(!cloud.key){S=parse(d.data);ls.set('pelada.cache',d.data);ui.sheet=null}
    else if(d.by!==DEVICE&&!cloud.timer){S=parse(d.data);cloud.sent=d.data;ls.set(KEY,d.data);ui.sheet=null} // outro aparelho gravou
  }
  absorbLegacy(); // notas que um app antigo tenha mandado junto dos jogadores
  render();
}

/* ---------- notas dos jogadores (1 a 5) ----------
   Sem placar ao vivo, ficam neste aparelho. Com placar ao vivo, só o admin vê: vão para o banco
   cifradas (AES-GCM) com uma chave tirada da senha do admin, e quem baixa sem a senha não entende nada. */
let RT=(()=>{try{return JSON.parse(ls.get('pelada.notas'))||{}}catch(e){return{}}})();
const T8=new TextEncoder();
const b64=u=>{let x='';u.forEach(c=>x+=String.fromCharCode(c));return btoa(x)};
const unb64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function notasKey(pw){
  const base=await crypto.subtle.importKey('raw',T8.encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:T8.encode('pelada-notas-v1'),iterations:150000,hash:'SHA-256'},
    base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function seal(obj,k){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,T8.encode(JSON.stringify(obj))));
  const out=new Uint8Array(12+ct.length);out.set(iv);out.set(ct,12);return b64(out);
}
async function unseal(t,k){
  const u=unb64(t);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},k,u.slice(12))));
}
function absorbLegacy(){
  if(!canRate())return;
  let changed=false;
  for(const id in LEGACY){if(!(id in RT)){RT[id]=LEGACY[id];changed=true}delete LEGACY[id]}
  if(changed)notasChanged();

/* lista colada do WhatsApp: "1. Fulano ✅", "- Beltrano (goleiro)", "[10/11 20:01] Ciclano: Fulano" etc. */
const fold=t=>t.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const findPlayer=name=>S.players.find(x=>fold(x.name)===fold(name));
function parseList(text){
  const lines=String(text).split(/\r?\n|;/).map(l=>l.replace(/^\s*\[[^\]]*\][^:]*:\s*/,'')); // tira "[data] Autor:" de mensagem copiada
  const numbered=lines.filter(l=>/^\s*\d{1,2}\s*[-.)º°:–—]/.test(l)).length>=2; // lista numerada: só valem as linhas com número
  const seen=new Set(),out=[];
  lines.forEach(l=>{
    if(numbered&&!/^\s*\d{1,2}\s*[-.)º°:–—]/.test(l))return;
    if(/:\s*$/.test(l))return; // títulos como "Goleiros:"
    let n=l.replace(/[\p{Extended_Pictographic}\u{FE0F}\u{200D}\u{20E3}\u{1F3FB}-\u{1F3FF}]/gu,' ')
      .replace(/^\s*(?:\d{1,2}\s*[-.)º°:–—]*|[-•*·>–—]+)\s*/,'')
      .replace(/\([^)]*\)|\[[^\]]*\]/g,' ').replace(/[*_~]/g,'')
      .replace(/\s+/g,' ').replace(/^[\s\-–—:.,;]+|[\s\-–—:.,;!?]+$/g,'').trim();
    if(!n||n.length>40||!/\p{L}/u.test(n))return;
    n=n.slice(0,24).trim();
    const k=fold(n);if(seen.has(k))return;seen.add(k);out.push(n);
  });
  return out;
}
function addNames(names){ // devolve [novos na pelada, que já estavam]

    if(c.present.includes(p.id))had++;else{c.present.push(p.id);added++}
  });
  return[added,had];
}

  return m.timeUp?'Tempo esgotado':'';

/* ---------- estatísticas ---------- */
const rate=(conc,ms)=>ms>0?conc/(ms/600000):Infinity;
function calc(sessions){
  const map=new Map();
  const get=id=>{if(!map.has(id))map.set(id,{id,name:pname(id),goals:0,own:0,ast:0,ms:0,conc:0,games:0,mp:0,wins:0});return map.get(id)};
  sessions.forEach(s=>{
    s.present.forEach(id=>get(id).games++);
    s.matches.forEach(m=>{
      const now=mNow(m);
      m.goals.forEach(g=>{if(g.own)get(g.p).own++;else get(g.p).goals++;if(g.a)get(g.a).ast++;if(g.gk)get(g.gk).conc++});
      m.gk.forEach(st=>st.forEach(x=>{get(x.p).ms+=(x.to==null?now:x.to)-x.from}));
      if(m.done&&m.rosters){
        const r=score(m);
        m.rosters.forEach((ro,i)=>ro.forEach(id=>{const p=get(id);p.mp++;if(r[i]>r[1-i])p.wins++}));
      }
    });
  });
  const all=[...map.values()],byName=(a,b)=>a.name.localeCompare(b.name);
  const top=k=>all.filter(p=>p[k]>0).sort((a,b)=>b[k]-a[k]||byName(a,b));
  const keepers=all.filter(p=>p.ms>0||p.conc>0).sort((a,b)=>
    ((b.ms>=MIN_GK)-(a.ms>=MIN_GK))||(rate(a.conc,a.ms)-rate(b.conc,b.ms))||(b.ms-a.ms));
  return{scorers:top('goals'),assists:top('ast'),owns:top('own'),presence:top('games'),keepers,
    wins:all.filter(p=>p.mp>0).sort((a,b)=>b.wins-a.wins||a.mp-b.mp||byName(a,b))};
}
/* resumo compacto de uma pelada: é o que vai no link compartilhado */
function summary(s){
  const st=calc([s]);
  return{d:s.date,
    m:s.matches.map(m=>{const r=score(m);return[m.names[0],r[0],r[1],m.names[1]]}),
    s:st.scorers.map(p=>[p.name,p.goals]),
    a:st.assists.map(p=>[p.name,p.ast]),
    k:st.keepers.map(p=>[p.name,p.conc,Math.round(p.ms/1000)])};
}

  '<button class="btn" data-a="copy">Copiar link do resultado</button>';
const opt=(v,cur,label)=>'<option value="'+v+'"'+(v===cur?' selected':'')+'>'+label+'</option>';

/* ---------- telas ---------- */
function vShared(){
  return mast('Resultado da pelada',longDate(ui.shared.d))+summaryHTML(ui.shared)+
    '<button class="btn" data-a="image">Salvar imagem do resultado</button>'+
    '<button class="btn" data-a="openApp">Abrir o app para marcar uma pelada</button>';
}
function vStart(){
  const kick=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
  if(isViewer())return mast(kick,'Pelada de Segunda',1,'Nenhuma pelada rolando agora. '+
    'Quando o marcador começar, o placar aparece aqui ao vivo. Enquanto isso, veja o Ranking e o Histórico.')+signHint;
  return mast(kick,'Pelada de Segunda',1,'Marque os gols e quem está no gol durante o jogo. '+
    'No fim, o app monta a artilharia e o goleiro menos vazado para mandar no grupo.')+
    '<button class="btn primary" data-a="newSession">Começar a pelada de hoje</button>';
}
const signHint='<div class="card" style="margin-top:34px"><h2>Vai marcar os gols?</h2><p class="empty">'+
  'Quem tem a senha do marcador ou do admin entra por aqui. Sem senha, você só acompanha.</p>'+
  '<button class="btn" data-a="scorer">Entrar com senha</button></div>';
function vWatch(c){ // pelada aberta, sem partida rolando, para quem não tem senha
  if(!c.present.length&&!c.matches.length)return vStart();
  let h=mast('Pelada de Segunda',longDate(c.date),0,c.matches.length?
    'Intervalo. O placar volta aqui assim que a próxima partida começar.':
    'A pelada começou. O placar aparece aqui assim que a primeira partida começar.');
  const teams=c.teams.map((t,i)=>[t,i]).filter(x=>x[0].length);
  if(teams.length)h+='<div class="card"><h2>Times</h2>'+teams.map(([t,i])=>
    '<div class="teamhead" style="--tc:'+COLORS[i][1]+';margin-top:4px"><span class="dot"></span>'+COLORS[i][0]+' <span class="muted">'+t.length+'</span></div>'+
    '<div class="chips" style="margin-bottom:14px">'+t.map(id=>'<span class="chip team" style="--tc:'+COLORS[i][1]+';display:inline-flex;align-items:center">'+esc(pname(id))+'</span>').join('')+'</div>').join('')+'</div>';
  else h+=card('Quem veio<small>'+c.present.length+'</small>','<div class="chips">'+c.present.map(id=>
    '<span class="chip" style="display:inline-flex;align-items:center">'+esc(pname(id))+'</span>').join('')+'</div>');
  if(c.matches.length)h+=card('Partidas de hoje',matchesHTML(summary(c).m));
  return h+signHint;
}
function vLobby(c){
  const roster=S.players.filter(p=>!p.archived||c.present.includes(p.id));
  const un=c.present.filter(id=>!c.teams.some(t=>t.includes(id)));
  const r=S.prefs.rules,rate=canRate();
  let h=mast('Pelada de Segunda',longDate(c.date));
  if(c.date!==today())h+='<div class="stale"><b>Esta pelada é de '+longDate(c.date)+' e não foi encerrada.</b>'+
    '<span class="muted">Encerre para salvar no histórico e começar a de hoje.</span>'+
    '<button class="btn primary" data-a="endSession">Encerrar a pelada de '+longDate(c.date)+'</button></div>';
  h+='<div class="card"><h2>Quem veio<small>'+c.present.length+'</small></h2><div class="chips">'+
    roster.map(p=>'<button class="chip'+(c.present.includes(p.id)?' on':'')+'" data-a="present" data-id="'+p.id+'">'+esc(p.name)+'</button>').join('')+
    (roster.length?'':'<p class="empty">Adicione quem chegou. Os nomes ficam guardados para as próximas peladas.</p>')+
    '</div><div class="row ed" style="margin-top:12px"><input type="text" id="add" placeholder="Nome do jogador" maxlength="24" autocomplete="off">'+
    '<button class="btn small" style="flex:none" data-a="addPlayer">Adicionar</button></div>'+
    (ui.paste?'<div class="paste ed"><label class="fld" for="paste">Cole a lista do grupo</label>'+
      '<textarea id="paste" placeholder="1. Álvaro&#10;2. Isac ✅&#10;3. Rafa (goleiro)" style="margin-top:6px"></textarea>'+
      '<div id="pastePrev"></div>'+
      '<button class="btn primary" id="pasteBtn" data-a="addList">Cole a lista acima</button>'+
      '<button class="btn" data-a="pasteToggle">Cancelar</button></div>':
     '<button class="link ed" data-a="pasteToggle">Colar uma lista de nomes</button>')+'</div>';
  if(c.present.length<2)return h+'<p class="empty">Com pelo menos dois jogadores, aparecem o sorteio dos times e a partida.</p>'+
    (c.date===today()?'<button class="btn danger ed" data-a="endSession">Descartar esta pelada</button>':'');
  h+='<div class="card"><h2>Times</h2><div class="seg ed">'+[2,3,4].map(n=>
    '<button class="'+(c.teams.length===n?'on':'')+'" data-a="nTeams" data-v="'+n+'">'+n+' times</button>').join('')+'</div>'+
    '<div class="row ed">'+(rate?'<button class="btn primary" style="margin-top:0" data-a="shuffleBal">Sortear equilibrado</button>':
      '<button class="btn" style="margin-top:0" data-a="shuffle">Sortear</button>')+'</div>';
  c.teams.forEach((t,i)=>{
    h+='<div class="teamhead" style="--tc:'+COLORS[i][1]+'"><span class="dot"></span>'+COLORS[i][0]+' <span class="muted">'+t.length+
      (rate&&t.length?' · força '+strength(t):'')+'</span>'+'</div><div class="chips">'+
      (t.map(id=>'<button class="chip team" style="--tc:'+COLORS[i][1]+'" data-a="cycle" data-id="'+id+'">'+esc(pname(id))+
        (rate?'<span class="r">'+rating(id)+'</span>':'')+'</button>').join('')||
       '<span class="muted">vazio</span>')+'</div>';
  });
  if(un.length)h+='<div class="teamhead" style="--tc:var(--muted)"><span class="dot"></span>Sem time <span class="muted">'+un.length+'</span></div><div class="chips">'+
    un.map(id=>'<button class="chip" data-a="cycle" data-id="'+id+'">'+esc(pname(id))+'</button>').join('')+'</div>';
  h+='<p class="muted ed" style="margin-bottom:0">Toque num nome para trocar de time.'+
    (rate?' A força é a soma das notas (quem não tem nota conta 3)'+(localMode()?'':'; só o admin vê')+'. As notas ficam em Histórico.':'')+'</p></div>';

  h+='<div class="card ed"><h2>Próxima partida</h2>';
  if(c.teams.length>2){
    const pk=ui.pick;
    [0,1].forEach(side=>{h+='<div class="chips" style="margin-bottom:10px">'+c.teams.map((t,i)=>
      '<button class="chip team'+((side?pk.b:pk.a)===i?' on':'')+'" style="--tc:'+COLORS[i][1]+'" data-a="pick" data-side="'+side+'" data-v="'+i+'">'+COLORS[i][0]+'</button>').join('')+
      '</div>'+(side?'':'<div class="vs">contra</div>')});
  }
  h+='<div class="row"><label class="fld">Tempo<select data-c="rmin">'+[0,5,7,8,10,12,15,20].map(v=>opt(v,r.min,v?v+' min':'Sem limite')).join('')+'</select></label>'+
    '<label class="fld">Acaba com<select data-c="rgoals">'+[0,1,2,3,4,5].map(v=>opt(v,r.goals,v?plural(v,'gol','gols'):'Sem limite')).join('')+'</select></label></div>'+
    '<label class="check"><input type="checkbox" data-c="rassist"'+(r.assist?' checked':'')+'> Marcar assistências</label>'+
    '<button class="btn primary" data-a="startMatch">Iniciar partida</button></div>';

  if(c.matches.length)h+=card('Partidas de hoje',matchesHTML(summary(c).m));
  h+='<button class="btn danger ed" data-a="endSession">Encerrar a pelada</button>';
  return h;
}
function vLive(c,m){
  const sc=score(m),tc=[colorOf(m.names[0]),colorOf(m.names[1])],over=overReason(m);
  const lim=[m.min?m.min+' min':'',m.maxGoals?plural(m.maxGoals,'gol','gols'):''].filter(Boolean).join(' ou ');
  const tn=side=>'<div class="tn" style="--tc:'+tc[side]+'"><i></i>'+esc(m.names[side])+'</div>';
  let h='<div class="board"><div class="btop"><span class="clock" id="clock">'+fmtClock(mNow(m))+'</span>'+
    '<span class="lim">'+(lim?'Acaba com '+lim:(m.runningSince?'Rolando':'Parado'))+'</span></div>'+
    '<div class="score"><div>'+tn(0)+'<div class="num">'+sc[0]+'</div></div><div class="x">×</div>'+
    '<div>'+tn(1)+'<div class="num">'+sc[1]+'</div></div></div>'+
    (over?'<div class="over">'+esc(over)+'</div>':'')+
    '<button class="btn ed" data-a="timer">'+(m.runningSince?'Pausar cronômetro':'Retomar cronômetro')+'</button></div>';
  h+='<div class="cols">';
  [m.a,m.b].forEach((ti,side)=>{
    const gk=curGk(m,side);
    h+='<div><div class="colh"><i class="dot" style="--tc:'+tc[side]+'"></i>'+esc(m.names[side])+'</div>'+(gk?'':'<div class="warn">Sem goleiro marcado</div>');
    c.teams[ti].forEach(id=>{
      const n=m.goals.filter(g=>g.p===id&&!g.own).length;
      h+='<button class="pbtn'+(gk===id?' gk':'')+'" style="--tc:'+tc[side]+'" data-a="player" data-id="'+id+'" data-side="'+side+'">'+
        '<span>'+esc(pname(id))+(gk===id?'<small>no gol</small>':'')+'</span>'+(n?'<span class="g">'+n+'</span>':'')+'</button>';
    });
    h+='</div>';
  });
  h+='</div><p class="muted ed">Toque no jogador para marcar gol ou colocar no gol.</p>';
  if(m.goals.length){
    h+='<div class="card"><h2>Gols<small>'+m.goals.length+'</small></h2><ul class="log">'+m.goals.slice().reverse().map(g=>
      '<li><span class="t">'+fmtClock(g.t)+'</span><span><b>'+esc(pname(g.p))+'</b>'+(g.own?' <span class="tag">contra</span>':'')+
      '<span class="muted">'+[g.a?'passe de '+esc(pname(g.a)):'',g.gk?'no gol: '+esc(pname(g.gk)):''].filter(Boolean).join(' · ')+'</span></span></li>').join('')+
      '</ul><button class="btn small ed" style="margin-top:8px" data-a="undo">Desfazer último gol</button></div>';
  }
  h+='<button class="btn primary ed" data-a="endMatch">Encerrar partida</button>';
  return h;
}
function vSheet(c,m){
  if(ui.sheet.assist){
    const g=m.goals[m.goals.length-1],mates=c.teams[ui.sheet.side?m.b:m.a].filter(x=>x!==g.p);
    return'<div class="back" data-a="closeSheet"><div class="sheet"><h3>Quem deu o passe?</h3>'+
      '<div class="muted">Gol de '+esc(pname(g.p))+'</div><div class="grid2">'+
      mates.map(id=>'<button class="btn" data-a="assist" data-id="'+id+'">'+esc(pname(id))+'</button>').join('')+
      '</div><button class="btn" data-a="noAssist">Sem assistência</button></div></div>';
  }
  const{id,side}=ui.sheet,isGk=curGk(m,side)===id;
  return'<div class="back" data-a="closeSheet"><div class="sheet"><h3>'+esc(pname(id))+'</h3>'+
    '<div class="muted"><i class="dot" style="--tc:'+colorOf(m.names[side])+'"></i>'+esc(m.names[side])+'</div>'+
    '<button class="btn primary" data-a="goal">Gol</button>'+
    '<button class="btn" data-a="gk">'+(isGk?'Sai do gol':'Vai para o gol')+'</button>'+
    '<button class="btn" data-a="ownGoal">Gol contra</button>'+
    '<button class="btn" data-a="noAssist">Cancelar</button></div></div>';
}
function vRank(){
  const hoje=S.current||S.sessions[0];
  let h=mast(ui.scope==='temp'?'Temporada':(S.current?'Pelada de hoje':'Última pelada'),'Ranking')+'<div class="seg"><button class="'+(ui.scope==='hoje'?'on':'')+'" data-a="scope" data-v="hoje">'+
    (S.current?'Hoje':'Última pelada')+'</button><button class="'+(ui.scope==='temp'?'on':'')+'" data-a="scope" data-v="temp">Temporada</button></div>';
  const temp=ui.scope==='temp',list=temp?S.sessions.concat(S.current?[S.current]:[]):(hoje?[hoje]:[]);
  if(!list.length)return h+'<p class="muted">Ainda não tem pelada registrada.</p>';
  const st=calc(list);
  h+=card('Artilharia',listHTML(st.scorers.map(p=>[p.name,p.goals,
      temp&&p.games?plural(p.games,'pelada','peladas')+' · média '+(p.goals/p.games).toFixed(1).replace('.',','):'']),'Nenhum gol ainda.'));
  if(st.assists.length)h+=card('Garçons',listHTML(st.assists.map(p=>[p.name,p.ast]),''));
  h+=card('Goleiro menos vazado',keepersHTML(st.keepers.map(p=>[p.name,p.conc,Math.round(p.ms/1000)])));
  if(st.wins.length)h+=card('Vitórias',listHTML(st.wins.map(p=>[p.name,p.wins,'em '+plural(p.mp,'partida','partidas'),
      Math.round(100*p.wins/p.mp)+'%']),''));
  if(temp)h+=card('Presença',listHTML(st.presence.map(p=>[p.name,p.games,'de '+plural(list.length,'pelada','peladas')]),''));
  if(st.owns.length)h+=card('Bola murcha (gols contra)',listHTML(st.owns.map(p=>[p.name,p.own]),''));
  return h;
}
function vCloud(){
  if(!cloud.on&&!cloud.exists&&!cloud.key)return'';
  let t,b='';
  if(!cloud.on)t='Sem conexão com o placar ao vivo agora.';
  else if(isAdmin()){t='Você é o admin: dá notas aos jogadores (só você vê), sorteia times equilibrados e marca gols.';
    b='<button class="btn" data-a="chgMarcador">Trocar senha do marcador</button><button class="btn" data-a="chgAdmin">Trocar senha do admin</button>'+
      '<button class="btn" data-a="leave">Sair do modo admin</button>'}
  else if(cloud.key){t='Você é o marcador: o que você marca aparece na hora para quem abrir o link.';
    b=(cloud.adminExists?'':'<button class="btn" data-a="mkAdmin">Criar senha do admin</button>')+'<button class="btn" data-a="leave">Sair do modo marcador</button>'}
  else if(cloud.exists){t='Você está acompanhando ao vivo. Só o marcador e o admin alteram o placar.';b='<button class="btn" data-a="scorer">Entrar com senha</button>'}
  else{t='Ative para a turma acompanhar o placar e o ranking pelo link, na hora.';b='<button class="btn primary" data-a="scorer">Ativar placar ao vivo</button>'}
  return'<div class="card"><h2>Placar ao vivo</h2><p class="muted" style="margin:0">'+t+'</p>'+b+'</div>';
}
function vHist(){
  if(ui.view){
    const s=S.sessions.find(x=>x.id===ui.view);
    if(s)return'<button class="btn small" data-a="back">← Voltar</button>'+mast('Pelada',longDate(s.date))+
      summaryHTML(summary(s))+shareBtns+'<button class="btn danger ed" data-a="delSession">Apagar esta pelada</button>';
    ui.view=null;
  }
  let h=mast('Pelada de Segunda','Histórico')+'<div class="card"><h2>Peladas<small>'+S.sessions.length+'</small></h2>';
  h+=S.sessions.length?S.sessions.map(s=>{
    const top=calc([s]).scorers[0];
    return'<button class="item" data-a="view" data-id="'+s.id+'"><span><span class="when">'+longDate(s.date)+'</span><span class="muted">'+
      plural(s.matches.length,'partida','partidas')+(top?' · artilheiro: '+esc(top.name)+' ('+top.goals+')':'')+'</span></span><span class="go">›</span></button>'}).join('')
    :'<p class="muted" style="margin:0">Nenhuma pelada encerrada ainda.</p>';
  h+='</div>'+vCloud()+'<div class="card ed"><h2>Jogadores</h2>';
  const ps=S.players.filter(p=>!p.archived);
  const rate=canRate(),rateNote=rate?(localMode()?'A nota (1 a 5) serve para o sorteio equilibrado.':
      'A nota (1 a 5) serve para o sorteio equilibrado e só aparece para o admin.'):
    (isAdmin()?'Carregando as notas…':'');
  h+=ps.length?(rateNote?'<p class="muted" style="margin:0 0 4px">'+rateNote+'</p>':'')+
    ps.map(p=>'<div class="item"><span style="font-weight:600">'+esc(p.name)+'</span><span class="acts">'+
    (rate?'<select class="mini" data-c="rating" data-id="'+p.id+'" aria-label="Nota de '+esc(p.name)+'">'+
      opt('',(p.id in RT)?RT[p.id]:'','Sem nota')+[1,2,3,4,5].map(v=>opt(v,RT[p.id],'Nota '+v)).join('')+'</select>':'')+
    '<button class="btn small" data-a="rename" data-id="'+p.id+'">Renomear</button>'+
    '<button class="btn small danger" data-a="archive" data-id="'+p.id+'">Tirar</button></span></div>').join('')
    :'<p class="muted" style="margin:0">Os jogadores aparecem aqui depois que você adicionar na pelada.</p>';
  h+='</div><div class="card"><h2>Backup</h2><p class="muted" style="margin-top:0">'+
    (cloud.key||isViewer()?'Guarde uma cópia dos dados em arquivo, por segurança.':'Os dados ficam só neste celular. Salve um arquivo de vez em quando.')+'</p>'+
    '<button class="btn" data-a="export">Salvar backup</button><button class="btn ed" data-a="import">Restaurar backup</button>'+
    '<input type="file" id="file" accept="application/json,.json" hidden></div>';
  return h;
}

const svg=d=>'<svg viewBox="0 0 24 24" aria-hidden="true">'+d+'</svg>';
const ICONS={ // desenhados à mão: cronômetro, pódio, súmula
  jogo:svg('<circle cx="12" cy="13.5" r="7.5"/><path d="M12 13.5V9.5M10 3h4M12 3v3M18.2 7.2l1.3-1.3"/>'),
  rank:svg('<path d="M3 20h18M5 20v-6h4.5v6M9.5 20V9h5v11M14.5 20v-8H19v8"/>'),
  hist:svg('<path d="M6 3.5h9l3 3V20.5H6z"/><path d="M9 10h6M9 13.5h6M9 17h3.5"/>')};
function render(){
  const app=$('#app'),nav=$('#nav');
  if(ui.shared){app.innerHTML=vShared();nav.style.display='none';return}
  nav.style.display='';
  document.body.classList.toggle('ro',isViewer());
  const c=S.current,m=liveMatch();
  let h;
  if(ui.tab==='rank')h=vRank();
  else if(ui.tab==='hist')h=vHist();
  else if(!c)h=vStart();
  else if(m)h=(isViewer()?'<div class="live"><i></i>Ao vivo</div>':'')+vLive(c,m)+(ui.sheet?vSheet(c,m):'');
  else{if(!ui.pick||ui.pick.a>=c.teams.length||ui.pick.b>=c.teams.length||ui.pick.a===ui.pick.b)ui.pick={a:0,b:1};h=isViewer()?vWatch(c):vLobby(c)}
  app.innerHTML=h;
  nav.innerHTML=[['jogo',ICONS.jogo,'Jogo'],['rank',ICONS.rank,'Ranking'],['hist',ICONS.hist,'Histórico']].map(t=>
    '<button class="'+(ui.tab===t[0]?'on':'')+'" data-a="tab" data-v="'+t[0]+'">'+t[1]+t[2]+'</button>').join('');
  if(ui.focusAdd){ui.focusAdd=false;const i=$('#add');if(i)i.focus()}
  if(ui.focusPaste){ui.focusPaste=false;const i=$('#paste');if(i)i.focus()}
  syncWake();
}

/* ---------- avisos, som e tela acesa ---------- */
let toastTimer;
function toast(msg,undoAction){
  const t=$('#toast');
  t.innerHTML='<span>'+esc(msg)+'</span>'+(undoAction?'<button data-a="'+undoAction+'">Desfazer</button>':'');
  t.style.display='flex';clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.style.display='none',4000);
}
const hideToast=()=>{$('#toast').style.display='none'};
let actx;
function primeAudio(){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){}}
function alarm(){
  try{primeAudio();[0,.35,.7].forEach(d=>{const o=actx.createOscillator(),g=actx.createGain();
    o.frequency.value=880;g.gain.value=.3;o.connect(g);g.connect(actx.destination);
    o.start(actx.currentTime+d);o.stop(actx.currentTime+d+.25)})}catch(e){}
  try{if(navigator.vibrate)navigator.vibrate([300,150,300,150,300])}catch(e){}
}
let wake=null;
async function syncWake(){ // mantém a tela acesa enquanto a partida rola
  const want=!!liveMatch()&&document.visibilityState==='visible';
  try{
    if(want&&!wake&&navigator.wakeLock){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>{wake=null})}
    else if(!want&&wake){const w=wake;wake=null;w.release()}
  }catch(e){}
}
document.addEventListener('visibilitychange',syncWake);

/* ---------- ações ---------- */
function setGk(m,side,id){
  const now=mNow(m),st=m.gk[side],l=st[st.length-1],was=l&&l.to==null?l.p:null;
  if(was){l.to=now;if(l.to<=l.from)st.pop()}
  if(id&&id!==was)st.push({p:id,from:now,to:null});
}
const pause=m=>{if(m.runningSince){m.elapsed=mNow(m);m.runningSince=null}};
function addGoal(own){
  const m=liveMatch();if(!m||!ui.sheet)return;
  const{id,side}=ui.sheet,team=own?1-side:side,c=S.current;
  m.goals.push({t:mNow(m),side:team,p:id,own,gk:curGk(m,1-team),a:null});
  const mates=c.teams[side?m.b:m.a].filter(x=>x!==id);
  ui.sheet=!own&&S.prefs.rules.assist&&mates.length?{assist:true,side}:null;
  const r=score(m);
  if(m.maxGoals&&Math.max(r[0],r[1])>=m.maxGoals){pause(m);alarm()}
  toast((own?'Gol contra de ':'Gol de ')+pname(id),'undo');
}
const shuffled=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const dealt=(ids,n)=>{const t=Array.from({length:n},()=>[]);ids.forEach((id,i)=>t[i%n].push(id));return t};
/* Sorteio equilibrado: os times ficam com o mesmo número de jogadores (ou um a mais) e com a soma das notas
   o mais parecida possível; empatando, também espalha os craques (nota 4 ou 5). Faz várias tentativas
   partindo de divisões aleatórias e troca jogadores entre times enquanto melhorar; entre as melhores
   divisões, escolhe uma ao acaso, para os times não saírem sempre iguais. */
function balance(ids,n){
  const cost=teams=>{
    const v=teams.map(strength),top=teams.map(t=>t.filter(id=>rating(id)>=4).length);
    return(Math.max(...v)-Math.min(...v))*1e4+(Math.max(...top)-Math.min(...top))*100+v.reduce((a,x)=>a+x*x,0)/1e4;
  };
  const tries=ids.length>2*n?300:20;
  let best=[],bestCost=Infinity;
  for(let k=0;k<tries;k++){
    const teams=dealt(shuffled(ids),n);
    let cur=cost(teams),better=true;
    while(better){
      better=false;
      for(let a=0;a<n;a++)for(let b=a+1;b<n;b++)for(let i=0;i<teams[a].length;i++)for(let j=0;j<teams[b].length;j++){
        const x=teams[a][i],y=teams[b][j];
        if(rating(x)===rating(y))continue;
        teams[a][i]=y;teams[b][j]=x;
        const c2=cost(teams);
        if(c2<cur-1e-9){cur=c2;better=true}else{teams[a][i]=x;teams[b][j]=y}
      }
    }
    if(cur<bestCost-1e-9){bestCost=cur;best=[teams]}else if(Math.abs(cur-bestCost)<1e-9)best.push(teams);
  }
  return best[Math.floor(Math.random()*best.length)];
}
function deal(balanced){
  const c=S.current,n=c.teams.length;
  c.teams=balanced?balance(c.present,n):dealt(shuffled(c.present),n);
}
function currentSummary(){
  if(ui.shared)return ui.shared;
  const s=S.sessions.find(x=>x.id===ui.view);
  return s?summary(s):null;
}
const A={
  tab(d){ui.tab=d.v;ui.view=null;ui.sheet=null},
  scope(d){ui.scope=d.v},
  newSession(){S.current={id:uid(),date:today(),present:[],teams:[[],[]],matches:[]};ui.pick={a:0,b:1}},
  present(d){
    const c=S.current,i=c.present.indexOf(d.id);
    if(i>=0){c.present.splice(i,1);c.teams=c.teams.map(t=>t.filter(x=>x!==d.id))}else c.present.push(d.id);
  },
  addPlayer(){
    const inp=$('#add'),name=inp.value.trim().replace(/\s+/g,' ');
    ui.focusAdd=true;if(!name)return;
    let p=findPlayer(name);
    if(p)p.archived=false;else{p={id:uid(),name};S.players.push(p)}
    if(!S.current.present.includes(p.id))S.current.present.push(p.id);
  },
  pasteToggle(){ui.paste=!ui.paste;ui.focusPaste=ui.paste},
  addList(){
    const t=$('#paste'),names=parseList(t?t.value:'');
    if(!names.length){toast('Não achei nomes. Cole um nome por linha.');return}
    const r=addNames(names);ui.paste=false;toast(addedMsg(r));
  },
  nTeams(d){
    const c=S.current,n=+d.v;
    while(c.teams.length<n)c.teams.push([]);
    c.teams.length=n;
  },
  shuffle(){deal(false)},
  shuffleBal(){
    if(!canRate())return;
    deal(true);
    const c=S.current;
    if(c.present.length>=c.teams.length)toast('Times sorteados. Diferença de força: '+spreadOf(c.teams));
  },
  cycle(d){
    const c=S.current,i=c.teams.findIndex(t=>t.includes(d.id));
    if(i>=0)c.teams[i]=c.teams[i].filter(x=>x!==d.id);
    if(i+1<c.teams.length)c.teams[i+1].push(d.id);
  },
  pick(d){
    const k=d.side==='1'?'b':'a',o=k==='a'?'b':'a',v=+d.v;
    if(ui.pick[o]===v)ui.pick[o]=ui.pick[k];
    ui.pick[k]=v;
  },
  startMatch(){
    const c=S.current,{a,b}=ui.pick,r=S.prefs.rules;
    if(!c.teams[a].length||!c.teams[b].length){toast('Coloque jogadores nos dois times primeiro');return}
    primeAudio();
    c.matches.push({a,b,names:[COLORS[a][0],COLORS[b][0]],min:r.min,maxGoals:r.goals,
      elapsed:0,runningSince:Date.now(),goals:[],gk:[[],[]],done:false});
  },
  timer(){
    const m=liveMatch();if(!m)return;
    primeAudio();
    if(m.runningSince)pause(m);else m.runningSince=Date.now();
  },
  player(d){ui.sheet={id:d.id,side:+d.side}},
  closeSheet(d,el,e){if(e.target===el)ui.sheet=null},
  goal(){addGoal(false)},
  ownGoal(){addGoal(true)},
  assist(d){const m=liveMatch();if(m&&m.goals.length)m.goals[m.goals.length-1].a=d.id;ui.sheet=null},
  noAssist(){ui.sheet=null},
  gk(){const m=liveMatch();if(!m||!ui.sheet)return;setGk(m,ui.sheet.side,ui.sheet.id);ui.sheet=null},
  undo(){const m=liveMatch();if(m&&m.goals.length){m.goals.pop();ui.sheet=null;hideToast()}},
  endMatch(){
    const m=liveMatch();if(!m)return;
    if(!overReason(m)&&!confirm('Encerrar esta partida?'))return;
    const c=S.current;
    pause(m);
    m.gk.forEach(st=>st.forEach(x=>{if(x.to==null)x.to=m.elapsed}));
    m.rosters=[c.teams[m.a].slice(),c.teams[m.b].slice()];
    m.done=true;ui.sheet=null;
    if(c.teams.length>2){ // quem ganhou fica, entra o time que estava de fora
      const r=score(m),stay=r[1]>r[0]?m.b:m.a;
      ui.pick={a:stay,b:c.teams.findIndex((t,i)=>i!==m.a&&i!==m.b)};
    }
  },
  endSession(){
    const c=S.current;
    if(!c.matches.length){if(confirm('Nenhuma partida foi jogada. Descartar esta pelada?'))S.current=null;return}
    if(!confirm('Encerrar a pelada de hoje e salvar no histórico?'))return;
    S.sessions.unshift(c);S.current=null;ui.tab='hist';ui.view=c.id;
  },
  view(d){ui.view=d.id},
  back(){ui.view=null},
  delSession(){
    if(!confirm('Apagar esta pelada do histórico? Não dá para desfazer.'))return;
    S.sessions=S.sessions.filter(s=>s.id!==ui.view);ui.view=null;
  },
  rename(d){
    const p=player(d.id),n=prompt('Novo nome',p.name);
    if(n&&n.trim())p.name=n.trim().slice(0,24);
  },
  archive(d){
    const p=player(d.id);
    if(confirm('Tirar '+p.name+' da lista? Os gols antigos continuam no histórico.'))p.archived=true;
  },
  share(){
    const o=currentSummary();if(!o)return;
    const text=shareText(o);
    if(navigator.share)navigator.share({text}).catch(()=>{});
    else window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank','noopener');
  },
  image(){
    const o=currentSummary();if(!o)return;
    drawCard(o).toBlob(b=>{
      const f=new File([b],'pelada-'+o.d+'.png',{type:'image/png'});
      if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f]}).catch(()=>{});
      else{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=f.name;a.click();
        setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Imagem salva')}
    },'image/png');
  },
  copy(){
    const o=currentSummary();if(!o)return;
    const url=shareUrl(o);
    (navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject()).then(
      ()=>toast('Link copiado'),()=>prompt('Copie o link:',url));
  },
  openApp(){ui.shared=null;history.replaceState(null,'',location.pathname)},
  export(){
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([JSON.stringify(canRate()?Object.assign({notas:RT},S):S)],{type:'application/json'}));
    a.download='pelada-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  },
  import(){$('#file').click()},
  scorer(){signIn()},
  mkAdmin(){createAdmin()},
  chgMarcador(){changeKey('pelada')},
  chgAdmin(){changeKey('admin')},
  leave(){leave()}
};
const VIEWER_OK=new Set(['tab','scope','view','back','share','image','copy','openApp','export','scorer']);
/* campos que mudam por seleção (regras da partida e nota do jogador) */
const C={
  rmin(el){S.prefs.rules.min=+el.value},
  rgoals(el){S.prefs.rules.goals=+el.value},
  rassist(el){S.prefs.rules.assist=el.checked},
  rating(el){
    if(!canRate())return;
    const id=el.dataset.id;
    if(el.value==='')delete RT[id];else RT[id]=Math.min(5,Math.max(1,+el.value));
    notasChanged();
  }
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const f=A[el.dataset.a];if(!f||(isViewer()&&!VIEWER_OK.has(el.dataset.a)))return;
  f(el.dataset,el,e);save();render();
});
document.addEventListener('input',e=>{
  if(e.target.id!=='paste')return;
  $('#pastePrev').innerHTML=pastePreview(e.target.value);$('#pasteBtn').textContent=pasteLabel(e.target.value);
});
document.addEventListener('paste',e=>{ // lista colada direto no campo de nome: adiciona todos de uma vez
  if(e.target.id!=='add'||isViewer())return;
  const t=(e.clipboardData||window.clipboardData).getData('text');
  if(!/\n/.test(t.trim()))return;
  e.preventDefault();
  const names=parseList(t);if(!names.length)return;
  const r=addNames(names);save();render();toast(addedMsg(r));
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='add'){A.addPlayer();save();render()}
});
document.addEventListener('change',e=>{
  if(isViewer())return;
  const c=e.target.dataset&&C[e.target.dataset.c];
  if(c){c(e.target);save();return}
  if(e.target.id!=='file'||!e.target.files[0])return;
  e.target.files[0].text().then(t=>{
    const d=JSON.parse(t);
    if(!Array.isArray(d.players)||!Array.isArray(d.sessions))throw new Error();
    if(!confirm('Substituir os dados deste celular pelo backup?'))return;
    S=normalize(d);
    if(d.notas&&typeof d.notas==='object')for(const id in d.notas)LEGACY[id]=Math.min(5,Math.max(1,+d.notas[id]||3));
    absorbLegacy();save();render();toast('Backup restaurado');
  }).catch(()=>toast('Arquivo de backup inválido'));
});
setInterval(()=>{
  const m=liveMatch();if(!m)return;
  if(!isViewer()&&m.min&&!m.timeUp&&mNow(m)>=m.min*60000){ // tempo esgotado: para o relógio e avisa
    m.timeUp=true;m.elapsed=m.min*60000;m.runningSince=null;
    alarm();save();render();toast('Tempo esgotado');return;
  }
  const el=$('#clock');if(el)el.textContent=fmtClock(mNow(m));
},500);

const NEW_HOME='https://pelada-de-segunda-30641.web.app/';
function moveHome(){ // o app mudou de endereço: o antigo redireciona e leva junto os dados guardados nele
  if(!location.hostname.endsWith('github.io'))return false;
  let hash=location.hash;
  if(!hash.startsWith('#r=')){
    const own=ls.get(KEY),d=parse(own);
    if(own&&own.length<60000&&(d.sessions.length||d.players.length||d.current))hash='#m='+enc(d);
  }
  location.replace(NEW_HOME+hash);return true;
}
function readHash(){
  const h=location.hash;
  if(h.startsWith('#r=')){try{ui.shared=cleanShared(dec(h.slice(3)))}catch(e){ui.shared=null}}
  if(h.startsWith('#m=')){ // dados trazidos do endereço antigo: só entram se este aparelho ainda não tem nada aqui
    try{
      const own=parse(ls.get(KEY)),d=normalize(dec(h.slice(3)));
      if(!(own.sessions.length||own.players.length||own.current)&&Array.isArray(d.players)&&Array.isArray(d.sessions)){
        ls.set(KEY,JSON.stringify(d));if(!isViewer())S=d;
      }
    }catch(e){}
    history.replaceState(null,'',location.pathname);
  }
}
window.addEventListener('hashchange',()=>{readHash();render()});
if(!moveHome()){
  readHash();absorbLegacy();render();cloudInit();
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
}
